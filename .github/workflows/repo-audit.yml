name: Repo Audit Bot

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: repo-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Scan code for security and correctness issues
        run: semgrep scan --config auto --error --metrics=off .

  dependencies-and-config:
    name: Dependencies and config (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Scan dependencies, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'